name: Release MyCodeBuddy

on:
  push:
    tags:
      - "v*.*.*-mycodebuddy.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-draft-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_body: ${{ steps.release.outputs.release_body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify fork repository
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" != "icannotwait/MyCodeBuddy" ]]; then
            echo "::error::Release workflow may run only for icannotwait/MyCodeBuddy."
            exit 1
          fi

      - name: Check tag commit belongs to default branch
        shell: bash
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$default_branch"

          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if git merge-base --is-ancestor "$tag_commit" "origin/$default_branch"; then
            echo "Tag $GITHUB_REF_NAME is based on $default_branch."
          else
            echo "::error::Tag $GITHUB_REF_NAME is not based on $default_branch."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify release configuration
        shell: bash
        run: node scripts/check-release-config.mjs --tag "$GITHUB_REF_NAME"

      - id: release
        name: Create or reuse draft release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const { owner, repo } = context.repo;
            const prerelease = false;
            const releaseName = `MyCodeBuddy ${tag}`;
            const { data: tagRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${tag}`,
            });

            let commitSha = tagRef.object.sha;
            if (tagRef.object.type === "tag") {
              const { data: annotatedTag } = await github.rest.git.getTag({
                owner,
                repo,
                tag_sha: commitSha,
              });
              if (annotatedTag.object.type !== "commit") {
                core.setFailed(
                  `Tag ${tag} points to ${annotatedTag.object.type}, not a commit.`,
                );
                return;
              }
              commitSha = annotatedTag.object.sha;
            }

            const { data: commit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: commitSha,
            });
            const releaseBody =
              commit.commit.message?.trim() || "_No commit message._";
            let release;

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              if (!existing.data.draft) {
                core.setFailed(
                  `Release for tag ${tag} already exists and is not a draft.`,
                );
                return;
              }

              release = existing.data;
              if (
                release.prerelease !== prerelease ||
                release.name !== releaseName ||
                (release.body ?? "").trim() !== releaseBody
              ) {
                const updated = await github.rest.repos.updateRelease({
                  owner,
                  repo,
                  release_id: release.id,
                  name: releaseName,
                  prerelease: false,
                  body: releaseBody,
                });
                release = updated.data;
              }
              core.info(`Reusing existing draft release #${release.id}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: releaseName,
                body: releaseBody,
                draft: true,
                prerelease: false,
              });
              release = created.data;
              core.info(`Created draft release #${release.id}`);
            }

            core.setOutput("release_id", String(release.id));
            core.setOutput("release_body", releaseBody);

  build-desktop:
    needs: create-draft-release
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            sidecar: codeg-mcp-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: desktop-${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate third-party licenses
        run: pnpm licenses:generate

      - name: Stage desktop sidecars
        run: pnpm tauri:prepare-sidecars --target ${{ matrix.target }}

      - name: Verify desktop sidecars
        shell: pwsh
        run: |
          $sidecars = @(
            "src-tauri/binaries/${{ matrix.sidecar }}"
          )
          foreach ($sidecar in $sidecars) {
            if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) {
              throw "Missing staged sidecar: $sidecar"
            }
            if ((Get-Item -LiteralPath $sidecar).Length -le 0) {
              throw "Staged sidecar is empty: $sidecar"
            }
          }

      - name: Build and upload desktop release
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: false
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }} --bundles nsis
          includeUpdaterJson: true
          retryAttempts: 2

  # Standalone codeg-server bundles (opt-in Cargo feature `server`). Mirrors
  # upstream's build-server matrix so self-update and install scripts can fetch
  # platform archives from GitHub Releases. Desktop NSIS remains Windows-only.
  build-server:
    needs: create-draft-release
    name: Server ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: codeg-server-linux-x64
          - name: Linux arm64
            runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: codeg-server-linux-arm64
          - name: macOS x64
            runner: macos-latest
            target: x86_64-apple-darwin
            artifact: codeg-server-darwin-x64
          - name: macOS arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact: codeg-server-darwin-arm64
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: codeg-server-windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: server-${{ matrix.target }}

      - name: Install Linux arm64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cat > /tmp/sources.list << 'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse

          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          sudo mv /tmp/sources.list /etc/apt/sources.list

          sudo dpkg --add-architecture arm64
          sudo apt-get update
          # libssl3 is Multi-Arch: same; align the preinstalled :amd64 copy
          # with the version libssl-dev:arm64 pins so the cross install isn't
          # blocked by a held-back amd64 copy (same failure mode as upstream
          # desktop arm64 builds).
          sudo apt-get install -y --only-upgrade libssl3
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libssl-dev:arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc-ar" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate third-party licenses
        run: pnpm licenses:generate

      - name: Build frontend
        run: pnpm build

      - name: Build server + codeg-mcp companion
        working-directory: src-tauri
        # This fork gates `codeg-server` behind Cargo feature `server` (upstream
        # builds the bin with only `--no-default-features`). codeg-mcp is built
        # with the same target so Linux arm64 shares the cross-compile env.
        run: |
          cargo build --release --bin codeg-server --no-default-features --features server --target ${{ matrix.target }}
          cargo build --release --bin codeg-mcp --no-default-features --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.artifact }}"
          cp "src-tauri/target/${{ matrix.target }}/release/codeg-server" "dist/${{ matrix.artifact }}/"
          cp "src-tauri/target/${{ matrix.target }}/release/codeg-mcp" "dist/${{ matrix.artifact }}/"
          chmod +x "dist/${{ matrix.artifact }}/codeg-server" "dist/${{ matrix.artifact }}/codeg-mcp"
          cp -r out "dist/${{ matrix.artifact }}/web"
          cp LICENSE NOTICE "dist/${{ matrix.artifact }}/"
          cp src-tauri/resources/THIRD_PARTY_LICENSES.txt "dist/${{ matrix.artifact }}/"
          for required in \
            "dist/${{ matrix.artifact }}/codeg-server" \
            "dist/${{ matrix.artifact }}/codeg-mcp" \
            "dist/${{ matrix.artifact }}/web/index.html" \
            "dist/${{ matrix.artifact }}/LICENSE" \
            "dist/${{ matrix.artifact }}/NOTICE" \
            "dist/${{ matrix.artifact }}/THIRD_PARTY_LICENSES.txt"
          do
            test -e "$required" || { echo "Missing server bundle entry: $required"; exit 1; }
          done
          ( cd dist && tar czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}" )

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifact = "${{ matrix.artifact }}"
          $bundleDir = "dist/$artifact"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/codeg-server.exe" "$bundleDir/codeg-server.exe"
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/codeg-mcp.exe" "$bundleDir/codeg-mcp.exe"
          Copy-Item -Recurse "out" "$bundleDir/web"
          Copy-Item "LICENSE" "$bundleDir/LICENSE"
          Copy-Item "NOTICE" "$bundleDir/NOTICE"
          Copy-Item "src-tauri/resources/THIRD_PARTY_LICENSES.txt" "$bundleDir/THIRD_PARTY_LICENSES.txt"

          foreach ($required in @(
            "$bundleDir/codeg-server.exe",
            "$bundleDir/codeg-mcp.exe",
            "$bundleDir/web/index.html",
            "$bundleDir/LICENSE",
            "$bundleDir/NOTICE",
            "$bundleDir/THIRD_PARTY_LICENSES.txt"
          )) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "Missing server bundle entry: $required"
            }
          }

          Compress-Archive -Path $bundleDir -DestinationPath "dist/$artifact.zip"

      - name: Smoke test packaged artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          test -x "dist/${{ matrix.artifact }}/codeg-server"
          test -x "dist/${{ matrix.artifact }}/codeg-mcp"
          # Only run --help for native targets; cross-compiled arm64 binaries
          # cannot execute on the x64 runner.
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ] || \
             [ "${{ matrix.target }}" = "x86_64-apple-darwin" ] || \
             [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            "dist/${{ matrix.artifact }}/codeg-mcp" --help | grep -F 'codeg-mcp --parent-connection-id'
          else
            echo "skipping codeg-mcp --help on cross-target ${{ matrix.target }}"
          fi

      - name: Smoke test packaged artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-server.exe")) {
            throw "codeg-server.exe missing from packaged artifact"
          }
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-mcp.exe")) {
            throw "codeg-mcp.exe missing from packaged artifact"
          }
          $help = & "dist/${{ matrix.artifact }}/codeg-mcp.exe" --help
          if ($LASTEXITCODE -ne 0) {
            throw "codeg-mcp.exe --help failed with exit code $LASTEXITCODE"
          }
          if ($help -notlike "*codeg-mcp --parent-connection-id*") {
            throw "codeg-mcp --help output unexpected: $help"
          }

      # Sign with the same minisign key as the desktop updater so
      # update::verify accepts server self-update downloads.
      - name: Sign and checksum bundle (Unix)
        if: runner.os != 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm tauri signer sign "dist/${{ matrix.artifact }}.tar.gz"
          test -f "dist/${{ matrix.artifact }}.tar.gz.sig"
          ( cd dist && shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256" )

      - name: Sign and checksum bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri signer sign "dist/${{ matrix.artifact }}.zip"
          if (-not (Test-Path "dist/${{ matrix.artifact }}.zip.sig")) {
            throw "signature not produced for ${{ matrix.artifact }}.zip"
          }
          $hash = (Get-FileHash -Algorithm SHA256 "dist/${{ matrix.artifact }}.zip").Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii "dist/${{ matrix.artifact }}.zip.sha256"

      - name: Upload to release (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "dist/${{ matrix.artifact }}.tar.gz" \
            "dist/${{ matrix.artifact }}.tar.gz.sig" \
            "dist/${{ matrix.artifact }}.tar.gz.sha256" \
            --clobber

      - name: Upload to release (Windows)
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "dist/${{ matrix.artifact }}.zip" \
            "dist/${{ matrix.artifact }}.zip.sig" \
            "dist/${{ matrix.artifact }}.zip.sha256" \
            --clobber

  publish-release:
    needs:
      - create-draft-release
      - build-desktop
      - build-server
    if: ${{ needs.build-desktop.result == 'success' && needs.build-server.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = Number(
              "${{ needs.create-draft-release.outputs.release_id }}",
            );

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              draft: false,
              prerelease: false,
            });

            core.info(`Published release #${releaseId}`);
